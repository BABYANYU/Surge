<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正在打开 Surge…</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font: -apple-system-body, -apple-system, "PingFang SC", sans-serif;
    background: #f5f5f7; color: #1d1d1f;
  }
  @media (prefers-color-scheme: dark) { body { background: #1c1c1e; color: #f2f2f7; } }
  main { text-align: center; padding: 32px 24px; max-width: 420px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
  p { font-size: 15px; line-height: 1.5; margin: 0 0 20px; opacity: .7; }
  a {
    display: inline-block; padding: 12px 28px; border-radius: 12px;
    background: #6699ff; color: #fff; text-decoration: none; font-size: 16px; font-weight: 500;
  }
  code { font-size: 13px; opacity: .6; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1 id="title">正在打开 Surge…</h1>
  <p id="hint">若未自动跳转，请点击下方按钮。</p>
  <a id="go" href="#">打开 Surge</a>
  <p style="margin-top:24px"><code id="raw"></code></p>
</main>
<script>
  var BASE = "https://raw.githubusercontent.com/BABYANYU/Surge/refs/heads/main/";
  var MODULES = {
    ippure:     "IPPure.sgmodule",
    landing:    "Route.sgmodule",
    latency:    "Latency.sgmodule",
    cron:       "Cron.sgmodule",
    youtube:    "YouTube-Plus.sgmodule",
    iqiyi:      "iQiYi.sgmodule",
    share115:   "115Share.sgmodule",
    ximalaya:   "Ximalaya.sgmodule",
    bilibili:   "Bilibili\u7a7a\u964d\u52a9\u624b.sgmodule"
  };

  var key = new URLSearchParams(location.search).get("m");
  var file = MODULES[key];
  var go = document.getElementById("go");

  if (!file) {
    document.getElementById("title").textContent = "未知模块";
    document.getElementById("hint").textContent = "链接缺少有效的模块标识，请返回仓库重新选择。";
    go.style.display = "none";
  } else {
    var raw = BASE + encodeURIComponent(file);
    var target = "surge:///install-module?url=" + encodeURIComponent(raw);
    go.href = target;
    document.getElementById("raw").textContent = file;
    location.replace(target);
  }
</script>
</body>
</html>
